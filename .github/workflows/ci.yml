name: Sunrise Dental CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SunriseDental/pom.xml

      - name: Run CI Unit Tests
        working-directory: SunriseDental
        run: mvn -B clean test -Dtest=PatientTest,AppointmentTest,PasswordUtilTest

      - name: Build WAR Package
        working-directory: SunriseDental
        run: mvn -B package -DskipTests

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseDental-WAR
          path: SunriseDental/target/SunriseDental.war
